{% extends "layout.html" %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <h1 class="auth-logo">MindDesk</h1>

        <h2>Create Your Account</h2>

        <p class="auth-subtitle">
            Organize your studies, stay productive, and achieve your goals.
        </p>

        <form class="auth-form" method="POST" action="{{ url_for('signup') }}">

            <p id="server-error" class="error-message">
    {% if error %}
        {{ error }}
    {% endif %}
</p>

            <div class="input-group">
                <label for="full-name">Full Name</label>
                <input
                    type="text"
                    id="full-name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
    type="email"
    id="email"
    name="email"
    placeholder="Enter your email"
    autocomplete="email"
    required>
            </div>
           
            <p id="email-error" class="error-message"></p>

            <div class="input-group">
                <label for="password">Password</label>
<div class="password-wrapper">
    <input
        type="password"
        id="password"
        name="password"
        placeholder="Create a password"
        required>

   <span class="toggle-password" data-target="password">
    <i class="fa-regular fa-eye"></i>
</span>

</div>

            <p id="password-error" class="error-message"></p>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
<div class="password-wrapper">
    <input
        type="password"
        id="confirm-password"
        name="confirm_password"
        placeholder="Confirm your password"
        required>

    <span class="toggle-password" data-target="confirm-password">
        <i class="fa-regular fa-eye"></i>
    </span>
</div>

            <p id="confirm-password-error" class="error-message"></p>

            <button type="submit" class="auth-button">
                Create Account
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Log In</a>
        </p>

    </div>

</section>

{% endblock %}
