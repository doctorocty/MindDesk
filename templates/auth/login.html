{% extends "layout.html" %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <h1 class="auth-logo">MindDesk</h1>

        <h2>Welcome Back</h2>

        <p class="auth-subtitle">
            Log in to continue your productivity journey.
        </p>

        <form class="auth-form" method="POST" action="{{ url_for('login') }}">

            <p id="server-error" class="error-message">
                {% if error %}
                    {{ error }}
                {% endif %}
            </p>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>
            </div>

            <p id="email-error" class="error-message"></p>

            <div class="input-group">
                <label for="password">Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                    <span class="toggle-password" data-target="password">
                        <i class="fa-regular fa-eye"></i>
                    </span>

                </div>
            </div>

            <p id="password-error" class="error-message"></p>

            <button type="submit" class="auth-button">
                Log In
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('signup') }}">Create Account</a>
        </p>

    </div>

</section>

{% endblock %}
